name: Palomar Weak omega-groupoid

on:
  push:
    branches: [main, codex/palomar-weak-omega-groupoid]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    name: Audit weak omega-groupoid artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Run the focused artifact quality gate
        run: palomar/weak-omega-groupoid/scripts/check.sh
      - name: Check recursive repair and semantic regressions
        run: bash palomar/weak-omega-groupoid/scripts/check-repair.sh

  comparator:
    name: Run pinned Comparator and NanoDa replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
          cache: false
      - name: Run the official pinned verifier toolchain
        run: palomar/weak-omega-groupoid/scripts/verify-comparator.sh
