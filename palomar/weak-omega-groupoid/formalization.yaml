automation:
  methods:
    - method: "manual"
      tool_setup: >-
        Reading and visually checking the accepted-manuscript PDF, selecting
        the mathematical boundary, comparing it with the native source, and
        recording provenance and exclusions.
    - method: "agent"
      models: ["Codex"]
      framework: "Lean 4.33.0, Lake, Mathlib, and Palomar Comparator/NanoDa"
      tool_setup: >-
        Standalone Challenge/Solution construction, focused compilation,
        source-closure inspection, exact declaration selection, and kernel
        axiom auditing.
      cost:
        wall_time: "local development"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        Preserve the distinction between Type-valued derivation data and its
        Prop-valued Nonempty projection; derive named coherence from the sole
        proof-irrelevance generator; and state all material exclusions.
  spend_usd: "not tracked"
  notes: >-
    The pinned Lean and Mathlib revisions are fixed by lean-toolchain and
    lake-manifest.json. Challenge.lean imports only Mathlib.Data.List.Basic;
    Solution.lean repeats the boundary independently. The Challenge contains
    twelve deliberate selected holes and Solution contains none. The selected
    declarations use only the recorded propext axiom; no Classical.choice,
    Quot.sound, native_decide, evaluator escape, or custom axiom is used.

fidelity:
  divergences: >-
    The attached manuscript describes a larger development with an explicit
    deep embedding, confluence/termination infrastructure, applications, and
    a full higher-cell presentation. This project mirrors the central
    proof-relevance split and the proof-irrelevance construction in a compact
    standalone namespace. Its CellType and WeakOmegaGroupoidBoundary declarations are
    the selected cell-tower boundary, not a claim that the compact file
    replaces every globular-map, operation, application, or metatheoretic
    theorem in the native repository. The higher indexed tail is intentionally
    schematic in its carrier, while levels 3 and 4 retain their explicit
    derivation boundaries.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The accepted manuscript was read against every selected declaration; the
    native ContractibilityIrrelevance and OmegaGroupoid developments were
    inspected for correspondence; both standalone modules compile; source
    closure, forbidden-marker, metadata, and axiom checks are automated by
    scripts/check.sh. This is a pre-submission self-assessment and does not
    claim Palomar mechanical or editorial review.

alignment:
  namespace: "ComputationalPaths.PalomarWeakOmegaGroupoid"
  statements:
    - source: "Trace-carrying computational paths distinguish an explicit rewrite trace from reflexivity"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.trace_is_observable"
      module: "Challenge.lean"
      status: "proved"
      note: "The one-step path made by ofEq is not the empty trace made by refl."
    - source: "Path groupoid laws"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.groupoid_laws"
      module: "Challenge.lean"
      status: "proved"
      note: "Unit and inverse laws are exposed as explicit RwProp witnesses."
    - source: "Groupoid laws for vertical composition of derivations"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.derivation_groupoid_laws"
      module: "Challenge.lean"
      status: "proved"
      note: "Associativity, unit, and inverse comparisons are derived at level 3."
    - source: "Higher contractibility at level 3"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.contractibility3"
      module: "Challenge.lean"
      status: "proved"
      note: "The sole primitive 3-cell transports across equality of RwProp projections."
    - source: "Higher contractibility at level 4"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.contractibility4"
      module: "Challenge.lean"
      status: "proved"
      note: "A separate Derivation4 boundary applies the same truncation pattern one level higher."
    - source: "Uniform higher-dimensional contraction"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.contractibilityHigher"
      module: "Challenge.lean"
      status: "proved"
      note: "The indexed tail is explicit and schematic in its carrier."
    - source: "Mac Lane pentagon routes"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.pentagon_route_counts"
      module: "Challenge.lean"
      status: "proved"
      note: "The left and right routes preserve distinct two-step and three-step derivation data."
    - source: "Derived pentagon coherence"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.pentagon_coherence"
      module: "Challenge.lean"
      status: "proved"
      note: "The two route values are parallel Derivation2 data and are connected by contractibility3."
    - source: "Derived triangle coherence"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.triangle_coherence"
      module: "Challenge.lean"
      status: "proved"
      note: "The long and short triangle routes are connected by contractibility3."
    - source: "Derived full interchange"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.interchange_coherence"
      module: "Challenge.lean"
      status: "proved"
      note: "Four composable 2-cells are compared in the full vertical/horizontal interchange shape."
    - source: "Derived Eckmann-Hilton coherence for 2-loops"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.eckmann_hilton_coherence"
      module: "Challenge.lean"
      status: "proved"
      note: "The two loop composites are connected by the same proof-irrelevance construction."
    - source: "Selected weak omega-groupoid boundary exists for every carrier"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.computational_paths_form_weak_omega_groupoid_boundary"
      module: "Challenge.lean"
      status: "proved"
      note: "The canonical assembly supplies the selected cell-tower boundary for any type A."
    - source: "Selected weak omega-groupoid cell-tower boundary"
      lean: "ComputationalPaths.PalomarWeakOmegaGroupoid.compPathOmegaGroupoidBoundary"
      module: "Challenge.lean"
      status: "proved"
      note: "The named CellType tower and selected contraction/coherence fields are assembled canonically."

