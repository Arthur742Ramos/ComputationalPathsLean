# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A proof-relevant weak omega-groupoid core for computational paths"
  description: >-
    A standalone Lean 4 formalization boundary for the central construction in
    the accepted paper "Computational Paths Form a Weak omega-Groupoid: A
    Constructive Proof". It defines trace-carrying paths, an explicit
    proof-relevant rewrite equivalence, derivations between rewrite witnesses,
    the canonical level-3 contraction obtained from proof irrelevance, and the
    uniform higher contraction. It also checks the path groupoid laws and
    supplies explicit proof-relevant associator, unit, inverse, pentagon,
    triangle, interchange, and Eckmann-Hilton coherence witnesses. This is a
    deliberately focused, independently compilable Palomar boundary: it does
    not claim to formalize the paper's circle applications, confluence
    development, stable-stem computations, or every declaration in the full
    repository.
  authors:
    - "Arthur F. Ramos"
    - "Tiago M. L. de Veras"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina G. de Oliveira"
  license: "MIT"
  responsible_maintainers:
    - "Arthur F. Ramos"

classification:
  arxiv: ["math.CT", "math.LO", "cs.LO"]
  msc2020: ["18N50", "03B38", "68V20"]

sources:
  - title: "Computational Paths Form a Weak omega-Groupoid: A Constructive Proof"
    authors:
      - "Arthur F. Ramos"
      - "Tiago M. L. de Veras"
      - "Ruy J. G. B. de Queiroz"
      - "Anjolina G. de Oliveira"
    type: "paper"
    location: "Accepted manuscript supplied with this submission; Abstract, Sections 3, 6, 7, 10, and 11"
    relationship: "formalizes"
    note: >-
      The selected declarations formalize the paper's central path/derivation
      tower and its proof-irrelevance coherence principle. The manuscript's
      applications and its full confluence development are outside this small
      independently checked boundary.
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/Arthur742Ramos/ComputationalPathsLean/tree/f90943eecdde516817fbc33863486b681a0a9645/ComputationalPaths/Path/OmegaGroupoid"
    relationship: "adapts"
    note: >-
      The selected project is a standalone Palomar mirror of the native
      higher-groupoid boundary. It preserves the correspondence with the
      repository's Path, RwEq, Derivation3, contractibility, and coherence
      developments while avoiding repository-local imports in Challenge.lean.

status:
  scope: >-
    The exact Comparator boundary covers trace observability; the four basic
    path groupoid rewrite laws; two explicit pentagon routes and their step
    counts; proof-irrelevance contractibility at levels 3 and above; and
    proof-relevant pentagon, triangle, interchange, Eckmann-Hilton, and bundled
    weak-groupoid witnesses. It is a focused core extraction, not a claim that
    the entire 49-page manuscript or the broad companion repository is one
    warning-free Palomar project.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext"]
  main_results:
    - declaration: "ComputationalPaths.PalomarWeakOmegaGroupoid.trace_is_observable"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext"]
      comparator_config: "comparator.json"
    - declaration: "ComputationalPaths.PalomarWeakOmegaGroupoid.groupoid_laws"
      file: "Solution.lean"
      sorry_count: 0
      axioms: []
      comparator_config: "comparator.json"
    - declaration: "ComputationalPaths.PalomarWeakOmegaGroupoid.pentagon_route_counts"
      file: "Solution.lean"
      sorry_count: 0
      axioms: []
      comparator_config: "comparator.json"
    - declaration: "ComputationalPaths.PalomarWeakOmegaGroupoid.computational_paths_form_weak_omega_groupoid"
      file: "Solution.lean"
      sorry_count: 0
      axioms: []
      comparator_config: "comparator.json"
    - declaration: "ComputationalPaths.PalomarWeakOmegaGroupoid.contractibility3"
      file: "Solution.lean"
      sorry_count: 0
      axioms: []
      comparator_config: "comparator.json"
    - declaration: "ComputationalPaths.PalomarWeakOmegaGroupoid.contractibilityHigher"
