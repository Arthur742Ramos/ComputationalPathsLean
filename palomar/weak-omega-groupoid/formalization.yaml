version: "v0.4"

project:
  name: "Computational paths: a weak omega-groupoid coherence core"
  description: >-
    A standalone Lean 4 formalization of the proof-relevant core of the
    accepted paper "Computational Paths Form a Weak omega-Groupoid: A
    Constructive Proof". A computational path is a finite, observable rewrite
    trace carrying an endpoint equality. Its 2-cells are Type-valued
    symmetric-reflexive-transitive rewrite derivations, while `RwProp` is the
    corresponding Nonempty proposition. The sole primitive 3-cell transports
    across equality of those propositions; `contractibility3`, level-4
    contraction, and the indexed higher tail are then derived with
    `Subsingleton.elim`. The same construction supplies explicit associativity
    routes, pentagon and triangle cells, the full four-2-cell interchange
    statement, Eckmann-Hilton coherence, and a named cell-tower boundary. This
    is an independently compilable core extraction, not a claim to reproduce
    every application, confluence proof, or auxiliary declaration in the
    49-page accepted manuscript.
  authors:
    - "Arthur F. Ramos"
    - "Tiago M. L. de Veras"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina G. de Oliveira"
  license: "MIT"
  responsible_maintainers:
    - "Arthur F. Ramos"

classification:
  arxiv: ["math.CT", "math.LO", "cs.LO"]
  msc2020: ["18N50", "03B38", "68V20"]

sources:
  - title: "Computational Paths Form a Weak ω-Groupoid: A Constructive Proof"
    authors:
      - "Arthur F. Ramos"
      - "Tiago M. L. de Veras"
      - "Ruy J. G. B. de Queiroz"
      - "Anjolina G. de Oliveira"
    type: "paper"
    location: "https://arxiv.org/abs/2512.00657"
    relationship: "formalizes"
    note: >-
      The attached accepted-manuscript PDF supplied for this submission is the
      primary source for the selected boundary. The public arXiv record is a
      stable locator for the earlier 24-page v1 and has a shorter title; it is
      not silently treated as identical to the accepted 49-page manuscript.
      The selected declarations track the manuscript's Sections 3, 6, 7, 10,
      and 11; its applications and full confluence development are outside
      this small Palomar project.
    author_endorsement: "not applicable"

related_formalizations:
  - id: "https://github.com/Arthur742Ramos/ComputationalPathsLean/tree/f90943eecdde516817fbc33863486b681a0a9645/ComputationalPaths/Path/OmegaGroupoid"
    relationship: "adapts"
    note: >-
      The native repository is the corresponding substantive development at
      the recorded immutable revision. This Palomar project re-implements the
      selected boundary in a standalone namespace because Challenge import
      closure cannot depend on repository-local source. The correspondence is
      recorded in NATIVE_CORRESPONDENCE.md rather than hidden behind an import.

status:
  scope: >-
    The exact Comparator boundary covers trace observability; the four basic
    path groupoid rewrite laws; the vertical groupoid laws for 2-cell
    derivations; two explicit pentagon routes with different step counts;
    proof-irrelevance contraction at levels 3 and 4 and in an indexed higher
    tail; the derived pentagon, triangle, full interchange, and
    Eckmann-Hilton cells; and the explicit cell-tower boundary construction.
    The result is deliberately a core extraction: it does not assert that
    these files alone formalize the manuscript's circle/HIT applications,
    Newman-style confluence development, stable-stem computations, or every
    globular and source-level auxiliary theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext"]
  challenge_deliberate_holes: 12
  main_results:
    - declaration: "ComputationalPaths.PalomarWeakOmegaGroupoid.trace_is_observable"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext"]
      comparator_config: "comparator.json"
    - declaration: "ComputationalPaths.PalomarWeakOmegaGroupoid.groupoid_laws"
