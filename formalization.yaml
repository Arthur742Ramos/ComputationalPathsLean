# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A Self-Contained Computational-Path Coherence Certificate"
  description: >-
    A compact, independently compilable Lean certificate for a
    trace-carrying computational-path calculus.  The selected theorem gives
    a Type-valued presentation of the symmetric reflexive transitive rewrite
    closure, proves both reification round trips, exhibits explicit Mac Lane
    pentagon and triangle routes with distinct primitive-edge counts, and
    records their extensional coherence boundary and inverse cancellation.
    The result is deliberately stated for Lean's extensional,
    proof-irrelevant setting: it does not claim an intensional HoTT identity
    type or a constructive Squier finite-derivation-type theorem.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.LO", "math.AT", "math.GN", "cs.LO"]
  msc2020: ["03B38", "18N20", "18N50", "55Q05", "68V15"]

sources:
  - title: "Computational Paths: A Calculus of Equality"
    authors:
      - "Arthur Freitas Ramos"
      - "Ruy J. G. B. de Queiroz"
      - "Anjolina Grisi de Oliveira"
    type: "paper"
    id: "https://github.com/Arthur742Ramos/ComputationalPathsLean/blob/2a2baa1f31c68f0e696021db91f8381dd2854652/paper/main.tex"
    location: "The higher-cell and weak omega-groupoid sections"
    relationship: "adapts"
    note: >-
      This submission adapts the computational-path notation and coherence
      questions developed in the paper into a standalone Palomar statement
      boundary.  The parent source snapshot is pinned to the immutable commit
      recorded below; the selected Challenge intentionally has no import from
      the repository's local implementation modules.
  - title: "Weak omega-categories from intensional type theory"
    authors:
      - "Peter Lumsdaine"
    type: "paper"
    id: "https://arxiv.org/abs/0812.0409"
    location: "Weak higher-categorical coherence from type-theoretic data"
    relationship: "background"
    note: >-
      Background for the weak omega-categorical terminology; the present
      Lean result is an extensional computational-path certificate with its
      proof-irrelevance boundary made explicit.
  - title: "Types are weak omega-groupoids"
    authors:
      - "Benno van den Berg"
      - "Richard Garner"
    type: "paper"
    id: "https://doi.org/10.1112/plms/pdq026"
    location: "Weak omega-groupoid interpretation of identity types"
    relationship: "background"
    note: >-
      Background for the comparison point; no claim is made that the present
      trace-carrying Path record is an intensional identity type.

related_formalizations:
  - id: "https://github.com/Arthur742Ramos/ComputationalPathsLean/commit/2a2baa1f31c68f0e696021db91f8381dd2854652"
    relationship: "adapts"
    note: >-
      The selected result is a compact, independently stated certificate.  The
      repository's larger normalization and coherence developments remain
      available under ComputationalPaths/Path/OmegaGroupoid/, while the
      Palomar-facing theorem has a separate standard-library-only Challenge
      closure.

status:
  scope: >-
    The selected declaration is an existence certificate for every carrier
    type A.  Its data are explicit: trace-carrying 1-cells; a complete
    Type-valued Derivation-2 presentation of RwEq; two distinct pentagon
    routes; two distinct triangle routes; extensional boundary coherence for
    those routes; inverse cancellation; and a concrete nontrivial trace
    witness.  No custom axioms, admit, evaluator escape, or external
    mathematical input is used by the selected proof.  The reported
    dependencies are only Lean's standard `propext`, `Quot.sound`, and
    `Classical.choice` as permitted by the Palomar contract.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "ComputationalPaths.Path.PalomarOmegaGroupoid433.main_result"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "manual"
      tool_setup: >-
        Mathematical scope selection, extensional-versus-intensional audit,
        theorem-boundary design, source attribution, and metadata review.
    - method: "agent"
      models: ["Codex"]
      framework: "Lean 4.33.0 and Lake"
      tool_setup: >-
        Focused extraction and proof review; every selected declaration is
        checked by the Lean kernel and by an independent Challenge/Solution
        compilation gate.
      cost:
        wall_time: "local development"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Focused omega-groupoid proof, dependency audit, and Palomar packaging."
  spend_usd: "not tracked"
  notes: >-
    The parent dependency is pinned by lean-toolchain and lake-manifest.json.
    Challenge and Solution are compiled independently; Challenge imports only
    Mathlib, and Solution proves the same declaration boundary without
    relying on Challenge's deliberate statement-side hole.

fidelity:
  divergences: >-
    The statement-facing file is intentionally compact and self-contained so
    Palomar can audit its transitive imports.  It is an explicit extraction of
    the trace, rewrite, and coherence ideas in the parent development, not a
    claim that every theorem in the broader repository is part of this result.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The selected proof was reviewed for exact endpoint typing,
    rewrite-closure round trips, explicit route lengths and separation,
    inverse cancellation, and the extensional proof-irrelevance boundary.
    The result is not described as a constructive Squier finite-derivation
    proof, intensional HoTT identity type, peer review, editorial approval, or
    mathematical endorsement.  Any Palomar editorial step is an automated
    editorial review identifying no blocking problem.

alignment:
  namespace: "ComputationalPaths.Path.PalomarOmegaGroupoid433"
  statements:
    - source: "Trace-carrying computational paths"
      lean: "ComputationalPaths.Path.PalomarOmegaGroupoid433.Path"
      module: "Challenge.lean"
      status: "proved"
      note: "The standalone lower cell retains the explicit Step-list trace and equality proof."
    - source: "Explicit 2-cell rewrite presentation"
      lean: "ComputationalPaths.Path.PalomarOmegaGroupoid433.Derivation₂"
      module: "Challenge.lean"
      status: "proved"
      note: "The selected certificate proves the presentation equivalence and both reification round trips against the standalone RwEq closure."
    - source: "Primitive rewrite presentation"
      lean: "ComputationalPaths.Path.PalomarOmegaGroupoid433.RewriteStep"
      module: "Challenge.lean"
      status: "proved"
      note: "Primitive associativity, unit, inverse, and congruence rewrites are explicit constructors."
    - source: "Explicit coherence routes"
      lean: "ComputationalPaths.Path.PalomarOmegaGroupoid433.pentagon_left_route"
      module: "Challenge.lean"
      status: "proved"
      note: "The pentagon and triangle routes are explicit RwEq syntax, with kernel-proved edge counts and extensional boundary coherence."
    - source: "Extensional coherence boundary"
      lean: "ComputationalPaths.Path.PalomarOmegaGroupoid433.BoundaryCoherence"
      module: "Challenge.lean"
      status: "proved"
      note: "The certificate states the exact extensional coherence boundary without overstating it as a proof-relevant higher syntax theorem."
    - source: "Selected certificate boundary"
      lean: "ComputationalPaths.Path.PalomarOmegaGroupoid433.OmegaGroupoidCertificate"
      module: "Challenge.lean"
      status: "proved"
      note: "The selected record packages the standalone auditable theorem boundary for every carrier type."

acknowledgements: >-
  Thanks to the authors and contributors of the Calculus of Computational
  Paths, Lean 4, Mathlib, and the Palomar Registry tooling.
