# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A Proof-Relevant 3-Truncated Weak Omega-Groupoid of Computational Paths"
  description: >-
    A focused Lean certificate for the repository's proof-relevant
    computational-path omega-groupoid.  It synchronizes the Type-valued
    stabilized derivation tower with the RwEq-level weak-groupoid package.
    The selected theorem records the exact Derivation-2/RwEq correspondence
    and both reification round trips, a typed normalizer with a decreasing
    core measure and core-strict output witness, explicit Mac Lane pentagon and triangle routes with proved
    distinct primitive-edge counts and explicit local-confluence diamond
    derivations for their coherence, inverse-cancellation coherence,
    proof-relevant interchange, and Eckmann--Hilton commutativity of 2-loops.
    It also records where the trace and higher derivation syntax is genuinely
    nontrivial.  The result is deliberately stated for Lean's extensional,
    proof-irrelevant setting: it does not claim an intensional HoTT identity
    type or a constructive Squier finite-derivation-type theorem.
  authors:
    - "Arthur Freitas Ramos"
    - "Ruy J. G. B. de Queiroz"
    - "Anjolina Grisi de Oliveira"
  license: "MIT"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.LO", "math.AT", "math.GN", "cs.LO"]
  msc2020: ["03B38", "18D05", "18N50", "55Q05", "68V15"]

sources:
  - title: "Computational Paths: A Calculus of Equality"
    authors:
      - "Arthur Freitas Ramos"
      - "Ruy J. G. B. de Queiroz"
      - "Anjolina Grisi de Oliveira"
    type: "paper"
    id: "https://github.com/Arthur742Ramos/ComputationalPathsLean/blob/2a2baa1f31c68f0e696021db91f8381dd2854652/paper/main.tex"
    location: "The higher-cell and weak omega-groupoid sections"
    relationship: "adapts"
    note: >-
      This submission selects and cross-checks the repository's native
      proof-relevant derivation tower, stabilized omega package, and explicit
      coherence-route modules.  The source snapshot is pinned to the
      immutable parent commit recorded below.
  - title: "Weak omega-categories from intensional type theory"
    authors:
      - "Peter Lumsdaine"
    type: "paper"
    id: "https://arxiv.org/abs/0812.0409"
    location: "Weak higher-categorical coherence from type-theoretic data"
    relationship: "background"
    note: >-
      Background for the weak omega-categorical terminology; the present
      Lean result is an extensional computational-path certificate with its
      proof-irrelevance boundary made explicit.
  - title: "Types are weak omega-groupoids"
    authors:
      - "Benno van den Berg"
      - "Richard Garner"
    type: "paper"
    id: "https://doi.org/10.1112/plms/pdq026"
    location: "Weak omega-groupoid interpretation of identity types"
    relationship: "background"
    note: >-
      Background for the comparison point; no claim is made that the present
      trace-carrying Path record is an intensional identity type.

related_formalizations:
  - id: "https://github.com/Arthur742Ramos/ComputationalPathsLean/commit/2a2baa1f31c68f0e696021db91f8381dd2854652"
    relationship: "adapts"
    note: >-
      The selected result is a compact, independently stated certificate over
      the pinned parent modules.  The full normalization and coherence
      developments remain available under ComputationalPaths/Path/OmegaGroupoid/;
      PalomarStatement.lean exposes their auditable theorem boundary.

status:
  scope: >-
    The selected declaration is an existence certificate for every carrier
    type A.  Its data are explicit: trace-carrying 1-cells; a complete
    Type-valued Derivation-2 presentation of RwEq; the native stabilized
    higher-cell tower; a decreasing normalization measure and typed
    normalization bridge; explicit two-route critical-pair calculations for
    the pentagon, triangle, and inverse laws; proof-relevant interchange; and
    Eckmann--Hilton commutativity for 2-loops.  The certificate separately
    proves route-syntax separation and lower/higher syntax nontriviality, so
    the higher contraction is not being offered as the sole mathematical
    content.  No custom axioms, sorry, admit, evaluator escape, or external
    mathematical input is used by the selected proof.  The reported
    dependencies are Lean's standard `propext`, `Quot.sound`, and
    `Classical.choice`, the latter occurring in the repository's existing
    RwEq reification package.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "ComputationalPaths.Path.PalomarOmegaGroupoid.main_result"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "manual"
      tool_setup: >-
        Mathematical scope selection, extensional-versus-intensional audit,
        theorem-boundary design, source attribution, and metadata review.
    - method: "agent"
      models: ["Codex"]
      framework: "Lean 4.24.0 and Lake"
      tool_setup: >-
        Focused extraction and proof review; every selected declaration is
        checked by the Lean kernel and by an independent Challenge/Solution
        compilation gate.
      cost:
        wall_time: "local development"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Focused omega-groupoid proof, dependency audit, and Palomar packaging."
  spend_usd: "not tracked"
  notes: >-
    The parent dependency is pinned by lean-toolchain and lake-manifest.json.
    The statement module is built separately before the independent
    Challenge and Solution modules are compiled; the selected proof also
    reuses the repository's checked normalization and coherence modules.

fidelity:
  divergences: >-
    The statement-facing file is intentionally compact, but its fields refer
    to the parent repository's native stabilized derivation tower and
    proof-relevant weak-groupoid package rather than copying them into a new
    interface.  It adds a finite syntax invariant for route separation and
    exposes the exact theorem boundary; it does not claim that every theorem
    in the broader parent repository is part of the selected result.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The selected proof was reviewed for exact cell indexing, endpoint typing,
    rewrite-closure round trips, decreasing normalization measures, explicit
    route lengths and separation, constructive local-confluence critical-pair
    derivations rather than primitive pentagon/triangle labels,
    proof-relevant interchange and Eckmann--Hilton cells, and the extensional
    proof-irrelevance boundary.  The result is not described as a constructive
    Squier finite-derivation proof, intensional HoTT identity type, peer
    review, editorial approval, or mathematical endorsement.  Any Palomar
    editorial step is an automated editorial review identifying no blocking
    problem.

alignment:
  namespace: "ComputationalPaths.Path.PalomarOmegaGroupoid"
  statements:
    - source: "Trace-carrying computational paths"
      lean: "ComputationalPaths.Path.Path"
      module: "ComputationalPaths/Path/Basic/Core.lean"
      status: "adapted"
      note: "The lower cell retains the explicit Step-list trace and equality proof."
    - source: "Explicit 2-cell rewrite presentation"
      lean: "ComputationalPaths.Path.OmegaGroupoid.Derivation₂"
      module: "ComputationalPaths/Path/OmegaGroupoid.lean"
      status: "proved"
      note: "The selected certificate proves soundness, completeness, and both reification round trips against RwEq."
    - source: "Typed core normalization"
      lean: "ComputationalPaths.Path.OmegaGroupoid.CoreStep"
      module: "ComputationalPaths/Path/OmegaGroupoid.lean"
      status: "proved"
      note: "The selected certificate records KBO/redex decrease, strict and core-strict normal forms, and a typed Derivation-3 normalization bridge."
    - source: "Proof-relevant coherence routes"
      lean: "ComputationalPaths.Path.OmegaGroupoidCompPaths.pentagon_coherence"
      module: "ComputationalPaths/Path/OmegaGroupoid/GroupoidProofs.lean"
      status: "proved"
      note: "Pentagon, triangle, and inverse-cancellation routes are explicit RwEq syntax; the selected pentagon and triangle 3-cells are derived from local-confluence diamonds with administrative normalization cells."
    - source: "Interchange and Eckmann--Hilton"
      lean: "ComputationalPaths.EckmannHilton.eckmann_hilton"
      module: "ComputationalPaths/Path/OmegaGroupoid/EckmannHiltonProof.lean"
      status: "proved"
      note: "The selected certificate includes proof-relevant interchange and commutativity of 2-loops."
    - source: "Stabilized omega-groupoid tower"
      lean: "ComputationalPaths.Path.OmegaGroupoid.Stabilization.compPathStabilizedOmegaGroupoid"
      module: "ComputationalPaths/Path/OmegaGroupoid/Stabilization.lean"
      status: "proved"
      note: "The native tower is contractible from level 4 upward while retaining explicit lower-cell syntax."

acknowledgements: >-
  Thanks to the authors and contributors of the Calculus of Computational
  Paths, Lean 4, Mathlib, and the Palomar Registry tooling.
